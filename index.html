<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>התהליך המלא — משקיע ארה״ב</title>
<style>
  :root{
    --ink:#1f2328; --muted:#6b7280; --faint:#9aa0a6;
    --line:#d6dade; --line-soft:#ededed; --bg:#ffffff; --accent:#384150;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); color:var(--ink); padding:22px 16px; line-height:1.55; font-size:15px;}
  .wrap{max-width:760px; margin:0 auto;}

  header{padding:2px 2px 12px; border-bottom:2px solid var(--ink);}
  header h1{font-size:1.2rem; font-weight:700; letter-spacing:-.2px;}
  header .sub{font-size:.76rem; color:var(--muted); margin-top:4px;}

  /* Toolbar */
  .toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:12px 0; border-bottom:1px solid var(--line-soft);}
  .track-toggle{display:inline-flex; border:1px solid var(--accent); border-radius:4px; overflow:hidden;}
  .track-toggle button{border:none; background:#fff; color:var(--accent); font-family:inherit; font-size:.82rem; font-weight:600; padding:5px 16px; cursor:pointer;}
  .track-toggle button.active{background:var(--accent); color:#fff;}
  .tool-sep{flex:1;}
  .mini-btn{border:1px solid var(--line); background:#fff; color:var(--muted); font-family:inherit; font-size:.78rem; font-weight:500; padding:5px 12px; border-radius:4px; cursor:pointer;}
  .mini-btn:hover{background:#f5f6f7;}
  .src-ind{font-size:.7rem; color:var(--faint); white-space:nowrap;}

  .legend{font-size:.72rem; color:var(--faint); padding:9px 2px 2px;}

  /* Marker (+/−) — replaces all chevrons/circles */
  .marker{flex-shrink:0; width:1em; text-align:center; color:var(--faint); font-weight:600; line-height:1;}
  .marker::before{content:'+';}
  .phase.open > .phase-head .marker::before,
  .step.open > .step-head .marker::before,
  .about.open > .about-head .marker::before{content:'\2212';}

  /* Phase — dry outline row */
  .phase{border-bottom:1px solid var(--line);}
  .phase-head{display:flex; align-items:baseline; gap:8px; padding:12px 2px; cursor:pointer; user-select:none;}
  .phase-num{flex-shrink:0; min-width:1.5em; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums;}
  .phase-title{flex:1; font-size:1rem; font-weight:600;}
  .phase-body{display:none; padding:0 0 8px;}
  .phase.open > .phase-body{display:block;}

  /* Step — nested list inside an open phase */
  .step{border-top:1px solid var(--line-soft);}
  .step-head{display:flex; align-items:baseline; gap:8px; padding:9px 0; padding-inline-start:1.8em; cursor:pointer; user-select:none;}
  .step-title{flex:1; font-size:.9rem; font-weight:500;}
  .step-body{display:none; padding:2px 0 12px; padding-inline-start:2.6em;}
  .step.open > .step-body{display:block;}

  .meta-line{font-size:.8rem; color:var(--muted); margin:2px 0;}
  .meta-line b{color:var(--ink); font-weight:600;}
  .deps{font-size:.78rem; color:var(--muted); margin:2px 0;}

  /* Tags — muted inline text, not pills */
  .tag{font-size:.72rem; color:var(--faint); white-space:nowrap;}
  .tag::before{content:'· '; color:var(--line);}

  /* Docs — plain ordered list, appears only inside an open step */
  ol.docs{list-style:none; margin:7px 0 0; padding:0;}
  .doc{padding:5px 0; border-top:1px dotted var(--line-soft); font-size:.84rem;}
  .doc:first-child{border-top:none;}
  .doc-label{color:var(--ink);}
  .src{font-size:.68rem; color:var(--faint); margin-top:2px; font-family:'Consolas',monospace;}
  .empty{font-size:.8rem; color:var(--faint); padding:5px 0;}

  /* Notes — plain start-border quote */
  .note{font-size:.8rem; color:var(--muted); border-inline-start:2px solid var(--line); padding-inline-start:10px; margin:9px 0 0;}

  /* About */
  .about{margin-top:20px; border-top:2px solid var(--ink);}
  .about-head{display:flex; align-items:baseline; gap:8px; padding:12px 2px; cursor:pointer; user-select:none; font-weight:600;}
  .about-body{display:none; padding:0 2px 14px;}
  .about.open > .about-body{display:block;}
  .about-body h4{font-size:.82rem; color:var(--muted); margin:14px 0 4px; font-weight:700;}
  .about-body ul{padding-inline-start:18px; font-size:.8rem; color:var(--muted);}
  .about-body ul li{margin-bottom:4px;}

  /* Cash mode: hide financed-only items */
  body.mode-cash [data-track="financed"]{display:none !important;}

  footer{text-align:center; font-size:.7rem; color:var(--faint); padding:22px 0 6px; margin-top:8px; border-top:1px solid var(--line-soft);}

  @media (max-width:600px){
    body{padding:14px 12px; font-size:14px;}
    header h1{font-size:1.08rem;}
    .step-head{padding-inline-start:1.4em;}
    .step-body{padding-inline-start:2em;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>התהליך המלא — משקיע ארה״ב</h1>
    <div class="sub" id="subline">טוען…</div>
  </header>

  <div class="toolbar">
    <div class="track-toggle">
      <button data-mode="financed" class="active">מימון</button>
      <button data-mode="cash">מזומן</button>
    </div>
    <button class="mini-btn" onclick="setAll(true)">הרחב הכל</button>
    <button class="mini-btn" onclick="setAll(false)">כווץ הכל</button>
    <span class="tool-sep"></span>
    <span class="src-ind emb" id="src-ind">…</span>
  </div>

  <div class="legend">מימון = פאזה/שלב במסלול מימון בלבד</div>

  <div id="phases"></div>

  <div class="about">
    <div class="about-head">
      <span style="flex:1;">אודות והערות פתוחות</span>
      <span class="marker"></span>
    </div>
    <div class="about-body" id="about-body"></div>
  </div>

  <footer>כלי פנימי · נקרא מ-<code>full-process.json</code> · v1</footer>
</div>

<script>
  let DATA = null;
  let mode = 'financed';
  let stepTitleById = {};

  const OWNER_HE = { investor:'משקיע', yossi:'יוסי', builder:'קבלן', pm:'מנהל נכס', title:'Title', 'title/escrow':'Title/Escrow', cpa:'CPA' };

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
  function ownerLabel(o){ if(!o) return ''; return OWNER_HE[o.toLowerCase()] || o; }
  function depsLabel(d){ if(!d||!d.length) return ''; return d.map(id=>stepTitleById[id]||id).join(' · '); }
  function docHTML(d){
    const src = d.source ? `<div class="src">מקור: ${esc(d.source)}</div>` : '';
    return `<li class="doc" data-track="${esc(d.track)}"><span class="doc-label">${esc(d.label)}</span>${src}</li>`;
  }

  function stepHTML(s){
    const fin = s.track==='financed' ? '<span class="tag">מימון</span>' : '';
    const owner = s.owner ? `<div class="meta-line"><b>אחראי:</b> ${esc(ownerLabel(s.owner))}</div>` : '';
    const docs = s.documents || [];
    const deps = depsLabel(s.depends_on);
    const depsLine = deps ? `<div class="deps">תלוי ב: ${esc(deps)}</div>` : '';
    const notes = s.notes ? `<div class="note">${esc(s.notes)}</div>` : '';
    const docsHTML = docs.length ? `<ol class="docs">${docs.map(docHTML).join('')}</ol>` : '<div class="empty">— אין מסמכים בשלב זה —</div>';
    return `<div class="step" data-track="${esc(s.track)}">
      <div class="step-head"><span class="step-title">${esc(s.title)}</span>${fin}<span class="marker"></span></div>
      <div class="step-body">${owner}${depsLine}${docsHTML}${notes}</div>
    </div>`;
  }

  function phaseHTML(p){
    const fin = p.track==='financed' ? '<span class="tag">מימון</span>' : '';
    const timing = p.timing ? `<div class="meta-line"><b>תזמון:</b> ${esc(p.timing)}</div>` : '';
    const steps = (p.steps||[]).map(stepHTML).join('');
    return `<div class="phase" data-track="${esc(p.track)}">
      <div class="phase-head">
        <span class="phase-num"></span>
        <span class="phase-title">${esc(p.title)}</span>
        ${fin}
        <span class="marker"></span>
      </div>
      <div class="phase-body">${timing}${steps}</div>
    </div>`;
  }

  function renderAbout(){
    const m = DATA.meta||{};
    const resolved = (DATA.resolved||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    const open = (DATA.open_items||[]).map(x=>`<li>${esc(x)}</li>`).join('');
    document.getElementById('about-body').innerHTML =
      (m.versions_note?`<div class="note">${esc(m.versions_note)}</div>`:'') +
      (resolved?`<h4>הוכרע (resolved)</h4><ul>${resolved}</ul>`:'') +
      (open?`<h4>פתוח (open items)</h4><ul class="open">${open}</ul>`:'');
  }

  function render(){
    stepTitleById = {};
    DATA.phases.forEach(p=>(p.steps||[]).forEach(s=>{ stepTitleById[s.id]=s.title; }));
    document.getElementById('phases').innerHTML = DATA.phases.map(phaseHTML).join('');
    const m = DATA.meta||{};
    document.getElementById('subline').textContent =
      `גרסה ${m.version||'—'} · מסלול מימון מציג הכל · מזומן מדלג על שלב ההלוואה`;
    renderAbout();
    applyTrack();
  }

  function applyTrack(){
    const cash = mode==='cash';
    document.body.classList.toggle('mode-cash', cash);
    let n=0;
    document.querySelectorAll('#phases .phase').forEach(ph=>{
      if(cash && ph.dataset.track==='financed') return;
      n++;
      const b=ph.querySelector('.phase-num'); if(b) b.textContent=n+'.';
    });
  }

  function setAll(open){
    document.querySelectorAll('#phases .phase, #phases .step').forEach(el=>el.classList.toggle('open', open));
  }

  function setSource(kind){
    const el=document.getElementById('src-ind');
    if(kind==='external'){ el.textContent='נטען מ-full-process.json'; el.className='src-ind ext'; }
    else { el.textContent='snapshot מוטמע'; el.className='src-ind emb'; }
  }

  // Accordion (event delegation)
  document.addEventListener('click', e=>{
    const ph=e.target.closest('.phase-head'); if(ph){ ph.parentElement.classList.toggle('open'); return; }
    const st=e.target.closest('.step-head'); if(st){ st.parentElement.classList.toggle('open'); return; }
    const ab=e.target.closest('.about-head'); if(ab){ ab.parentElement.classList.toggle('open'); return; }
  });

  // Track toggle
  document.querySelectorAll('.track-toggle button').forEach(b=>{
    b.addEventListener('click', ()=>{
      mode=b.dataset.mode;
      document.querySelectorAll('.track-toggle button').forEach(x=>x.classList.toggle('active', x===b));
      applyTrack();
    });
  });

  async function load(){
    try{
      const res = await fetch('./full-process.json', {cache:'no-store'});
      if(!res.ok) throw new Error('http '+res.status);
      DATA = await res.json();
      setSource('external');
    }catch(e){
      DATA = JSON.parse(document.getElementById('embedded-data').textContent);
      setSource('embedded');
    }
    render();
  }
  load();
</script>
</body>
</html>
